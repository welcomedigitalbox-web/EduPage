# Vercel's Hobby plan only allows ONE cron run per day, and a more frequent
# expression in vercel.json makes the deployment itself fail. Follow-ups are
# useless once a day — the 24-hour Messenger window would already be closed —
# so GitHub Actions drives the real schedule. It is free and plan-independent.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL      https://your-app.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET env var in Vercel
name: Scheduled jobs

on:
  schedule:
    - cron: '*/15 * * * *'   # follow-up sweep, every 15 minutes (UTC)
    - cron: '25 * * * *'     # ads sync, hourly
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Follow-up sweep
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X GET "${{ secrets.APP_URL }}/api/cron/follow-ups" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Ads sync
        if: github.event.schedule == '25 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X GET "${{ secrets.APP_URL }}/api/cron/sync-ads?days=7" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
